name: spork create
description: Create a private copy of a public repository that keeps itself in sync with upstream.
author: Shardbyte
branding:
  icon: copy
  color: purple

inputs:
  upstream:
    description: Upstream repository, as owner/repo or a git URL.
    required: true
  owner:
    description: User or organization to create the copy under. Defaults to the admin-token's user.
    required: false
    default: ""
  name:
    description: Name of the new repository. Defaults to upstream's name.
    required: false
    default: ""
  upstream-branch:
    description: Upstream branch to track. Defaults to upstream's default branch.
    required: false
    default: ""
  target-branch:
    description: Branch that mirrors upstream.
    required: false
    default: upstream
  base-branch:
    description: Working/default branch of the new repository.
    required: false
    default: main
  on-update:
    description: pr | none | fast-forward | merge
    required: false
    default: pr
  schedule:
    description: Cron schedule for the sync workflow.
    required: false
    default: "23 */6 * * *"
  runs-on:
    description: Runner for the sync job, e.g. self-hosted or "[self-hosted, linux]".
    required: false
    default: ubuntu-latest
  sync-tags:
    description: Also mirror upstream tags.
    required: false
    default: "false"
  action-ref:
    description: Sync action the new repository uses.
    required: false
    default: Shardbyte/spork@v1
  admin-token:
    description: >-
      Token that can create repositories and manage their settings, secrets
      and workflows. Not needed with admin-auth app.
    required: false
    default: ""
  admin-auth:
    description: >-
      gh (use admin-token) or app (create the repository as the GitHub App
      given by app-id/app-private-key; owner must be an organization the App
      is installed on).
    required: false
    default: gh
  auth:
    description: How the sync authenticates, token or app.
    required: false
    default: token
  sync-token:
    description: (auth token) Stored as the SPORK_TOKEN secret of the new repository. Leave empty to set it yourself.
    required: false
    default: ""
  app-id:
    description: (auth app) GitHub App ID or client ID, stored as the SPORK_APP_ID variable.
    required: false
    default: ""
  app-private-key:
    description: (auth app) GitHub App private key, stored as the SPORK_APP_PRIVATE_KEY secret.
    required: false
    default: ""

outputs:
  repository:
    description: owner/name of the created repository.
    value: ${{ steps.create.outputs.repository }}
  url:
    description: URL of the created repository.
    value: ${{ steps.create.outputs.url }}

runs:
  using: composite
  steps:
    - id: create
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.admin-token }}
        SPORK_TOKEN: ${{ inputs.sync-token }}
        SPORK_APP_ID: ${{ inputs.app-id }}
        SPORK_APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        IN_AUTH: ${{ inputs.auth }}
        IN_ADMIN_AUTH: ${{ inputs.admin-auth }}
        IN_UPSTREAM: ${{ inputs.upstream }}
        IN_OWNER: ${{ inputs.owner }}
        IN_NAME: ${{ inputs.name }}
        IN_UPSTREAM_BRANCH: ${{ inputs.upstream-branch }}
        IN_TARGET_BRANCH: ${{ inputs.target-branch }}
        IN_BASE_BRANCH: ${{ inputs.base-branch }}
        IN_ON_UPDATE: ${{ inputs.on-update }}
        IN_SCHEDULE: ${{ inputs.schedule }}
        IN_SYNC_TAGS: ${{ inputs.sync-tags }}
        IN_RUNS_ON: ${{ inputs.runs-on }}
        IN_ACTION_REF: ${{ inputs.action-ref }}
      run: |
        args=(create "$IN_UPSTREAM"
          --target-branch "$IN_TARGET_BRANCH" --base-branch "$IN_BASE_BRANCH"
          --on-update "$IN_ON_UPDATE" --schedule "$IN_SCHEDULE" --action-ref "$IN_ACTION_REF" --runs-on "$IN_RUNS_ON" --auth "$IN_AUTH" --admin-auth "$IN_ADMIN_AUTH")
        [[ -z $IN_OWNER ]] || args+=(--owner "$IN_OWNER")
        [[ -z $IN_NAME ]] || args+=(--name "$IN_NAME")
        [[ -z $IN_UPSTREAM_BRANCH ]] || args+=(--upstream-branch "$IN_UPSTREAM_BRANCH")
        [[ $IN_SYNC_TAGS != true ]] || args+=(--sync-tags)
        "$GITHUB_ACTION_PATH/../scripts/spork" "${args[@]}"
